name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The claude command only checks the plugin here. No updates, no telemetry, no sign-in.
      DISABLE_UPDATES: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The job runs an outside program below. Leave no token on disk for it to read.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The abilities test needs the claude command (ADR-0001 Section 3, RUL-3207).
      # One exact version, straight from Anthropic's release folder. The file is checked
      # against the hash recorded here before it is made runnable. A wrong hash fails the run.
      # The test runs this exact file through CLAUDE_BIN. It is not put on the search path.
      # To change the version (https://code.claude.com/docs/en/setup, "Binary integrity and code signing"):
      #   1. Verify that release's manifest.json.sig, and confirm the primary key fingerprint is
      #      31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF 1A7E CACE, the one the setup page lists.
      #   2. Only then copy the linux-x64 checksum from that manifest.json.
      #   3. Do the verify on a GitHub runner (downloads.claude.ai is blocked from cloud threads),
      #      and link its log in the pull request that changes the version.
      - name: Install the claude command
        env:
          CLAUDE_VERSION: 2.1.330
          CLAUDE_SHA256: f390eaa0814e6a1bff74cbb47acb74cb9c89d30ced809fe0af5af00c7bfe8ebb
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/claude-bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/claude-bin/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_VERSION/linux-x64/claude"
          echo "$CLAUDE_SHA256  $RUNNER_TEMP/claude-bin/claude" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/claude-bin/claude"
          echo "CLAUDE_BIN=$RUNNER_TEMP/claude-bin/claude" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run build:board
      - run: npm test
