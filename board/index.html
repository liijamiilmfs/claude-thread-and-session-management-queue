<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thread Queue</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #1b2130; --muted: #636b7c; --line: #dde1e8;
  --accent: #3355cc; --needs: #b25a00; --ok: #1d7a4a; --bad: #b3261e;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --card: #1d2027; --fg: #e7e9ee; --muted: #9aa2b1; --line: #2c313b;
    --accent: #8aa2ff; --needs: #f0a653; --ok: #5fcf93; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --card: #1d2027; --fg: #e7e9ee; --muted: #9aa2b1; --line: #2c313b;
  --accent: #8aa2ff; --needs: #f0a653; --ok: #5fcf93; --bad: #ff8a80; color-scheme: dark;
}
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 12px; margin: 0; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
p { margin: 0; }
.muted { color: var(--muted); }
header { display: flex; flex-direction: column; gap: 4px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#list { display: flex; flex-direction: column; gap: 14px; }
.day { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  color: inherit; text-decoration: none;
}
.row:hover { border-color: var(--accent); }
.top { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.chip { font-size: 12px; white-space: nowrap; color: var(--muted); }
.chip.needs { color: var(--needs); font-weight: 600; }
.chip.ok { color: var(--ok); }
.chip.bad { color: var(--bad); font-weight: 600; }
.project { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview { color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Thread Queue</h1>
    <p class="muted">Every finished turn that told you something shows up here.</p>
  </header>
  <p id="status" class="muted" role="status">Loading the list…</p>
  <section id="list" aria-label="Threads"></section>
</main>
<script type="module" src="board.js"></script>
</body>
</html>
